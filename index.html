<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Os Tributos Permanentes - Assinaturas & Recorrências</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Firebase Compat Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=MedievalSharp&display=swap" rel="stylesheet">

  <style>
    body { background-color: #0f0d0a; color: #e2d2b4; font-family: 'MedievalSharp', cursive, serif; }
    .font-title { font-family: 'Cinzel Decorative', serif; }
    .gold-border { border: 1px solid #b8860b; box-shadow: 0 0 10px rgba(184, 134, 11, 0.15); }
    .elvish-glow:focus-within, .elvish-glow:hover { box-shadow: 0 0 12px rgba(212, 175, 55, 0.35); border-color: #d4af37; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f0d0a; }
    ::-webkit-scrollbar-thumb { background: #3a2e1e; border-radius: 3px; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="p-3 md:p-5 min-h-screen flex flex-col justify-between relative" x-data="assinaturasApp()">

  <div class="max-w-4xl mx-auto w-full space-y-5">
    
    <!-- HEADER -->
    <header class="flex justify-between items-center border-b border-[#3a2e1e] pb-3">
      <div>
        <h1 class="font-title text-xl md:text-2xl text-[#d4af37] tracking-wider drop-shadow-md">
          📜 Os Tributos Permanentes
        </h1>
        <p class="text-[11px] md:text-xs text-[#a39274]">
          Widget 07 • Controle de Assinaturas, Servidores & Recorrências
        </p>
      </div>

      <button @click="carregarDados()" 
        class="bg-[#1c1712] hover:bg-[#2e2316] text-[#d4af37] text-xs font-semibold py-1.5 px-3 rounded border border-[#b8860b]/40 flex items-center gap-1.5 transition cursor-pointer active:scale-95">
        <span :class="carregando ? 'animate-spin' : ''">⚡</span>
        <span x-text="carregando ? 'Sincronizando...' : 'Sincronizar'"></span>
      </button>
    </header>

    <!-- METRICAS -->
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-3">
      <div class="bg-[#181410] p-3 rounded-lg gold-border">
        <span class="text-[10px] text-[#a39274]">📋 Assinaturas Ativas</span>
        <div class="text-xl font-bold text-[#d4af37]" x-text="assinaturas.length + ' tributos'"></div>
      </div>

      <div class="bg-[#181410] p-3 rounded-lg gold-border">
        <span class="text-[10px] text-[#a39274]">💸 Custo Fixo Mensal</span>
        <div class="text-xl font-bold text-[#e5a93c]" x-text="formatarMoeda(calcularTotalMensal())"></div>
      </div>

      <div class="bg-[#181410] p-3 rounded-lg gold-border">
        <span class="text-[10px] text-[#a39274]">📅 Custo Anual Projetado</span>
        <div class="text-xl font-bold text-[#8fb388]" x-text="formatarMoeda(calcularTotalMensal() * 12)"></div>
      </div>
    </section>

    <!-- FORMULÁRIO -->
    <section class="bg-[#181410] p-4 rounded-lg gold-border space-y-3">
      <h2 class="text-sm text-[#d4af37] font-semibold flex items-center justify-between">
        <span class="flex items-center gap-2">
          <span>✍️</span> 
          <span x-text="editandoId ? 'Editar Tributo' : 'Cadastrar Novo Tributo / Assinatura'"></span>
        </span>
        <button x-show="editandoId" @click="cancelarEdicao()" class="text-xs text-[#8b0000] hover:underline">Cancelar Edição</button>
      </h2>

      <form @submit.prevent="salvarAssinatura()" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
        <!-- Nome -->
        <div>
          <label class="block text-[11px] text-[#a39274] mb-1">Serviço / Assinatura</label>
          <input type="text" x-model="nome" placeholder="Ex: Adobe Creative Cloud..." required class="w-full bg-[#0f0d0a] border border-[#3a2e1e] text-[#e2d2b4] text-xs rounded p-2.5 outline-none elvish-glow">
        </div>

        <!-- Valor Mensal -->
        <div>
          <label class="block text-[11px] text-[#a39274] mb-1">Valor Mensal (R$)</label>
          <input type="number" step="0.01" x-model="valor" placeholder="Ex: 124.00" required class="w-full bg-[#0f0d0a] border border-[#3a2e1e] text-[#e2d2b4] text-xs rounded p-2.5 outline-none elvish-glow">
        </div>

        <!-- Dia do Cobrança -->
        <div>
          <label class="block text-[11px] text-[#a39274] mb-1">Dia da Cobrança</label>
          <input type="number" min="1" max="31" x-model="diaCobranca" placeholder="Ex: 15" required class="w-full bg-[#0f0d0a] border border-[#3a2e1e] text-[#e2d2b4] text-xs rounded p-2.5 outline-none elvish-glow">
        </div>

        <!-- Forma de Pagamento -->
        <div>
          <label class="block text-[11px] text-[#a39274] mb-1">Pagamento</label>
          <select x-model="pagamento" class="w-full bg-[#0f0d0a] border border-[#3a2e1e] text-[#e2d2b4] text-xs rounded p-2.5 outline-none elvish-glow">
            <option value="Cartão de Crédito">💳 Cartão de Crédito</option>
            <option value="Débito Automático">🏦 Débito Automático</option>
            <option value="PIX / Boleto">⚡ PIX / Boleto</option>
          </select>
        </div>

        <!-- Botão Ação -->
        <div class="sm:col-span-4 flex items-end">
          <button type="submit" class="w-full bg-[#b8860b] hover:bg-[#d4af37] text-[#0f0d0a] font-bold py-2.5 px-4 text-xs rounded transition active:scale-95">
            <span x-text="editandoId ? 'Atualizar Tributo' : '📜 Decretar Novo Tributo'"></span>
          </button>
        </div>
      </form>
    </section>

    <!-- LISTA -->
    <section class="bg-[#14100c] p-4 rounded-lg border border-[#2e2316] space-y-3">
      <h2 class="text-sm text-[#d4af37] font-semibold flex items-center justify-between border-b border-[#2e2316] pb-2">
        <span>📜 Tributos Recorrentes Ativos</span>
        <span class="text-[10px] bg-[#2e2316] text-[#a39274] px-2 py-0.5 rounded-full" x-text="assinaturas.length"></span>
      </h2>

      <div class="space-y-2 text-xs max-h-96 overflow-y-auto pr-1">
        <template x-for="item in assinaturas" :key="item.id">
          <div class="bg-[#1c1712] p-3 rounded border border-[#2e2316] flex flex-col md:flex-row md:items-center justify-between gap-2 hover:border-[#b8860b]/40 transition">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="font-bold text-sm text-[#e2d2b4]" x-text="item.nome"></span>
                <span class="text-[9px] bg-amber-900/40 text-amber-300 border border-amber-700/50 px-1.5 py-0.5 rounded font-bold" x-text="'Dia ' + item.diaCobranca"></span>
              </div>
              <div class="text-[11px] text-[#a39274]">
                <span>💳 <strong class="text-[#e2d2b4]" x-text="item.pagamento"></strong></span>
              </div>
            </div>

            <div class="flex items-center justify-between md:justify-end gap-3 border-t md:border-t-0 border-[#2e2316] pt-2 md:pt-0">
              <div class="text-right">
                <div class="font-bold text-sm text-[#d4af37]" x-text="formatarMoeda(item.valor) + ' /mês'"></div>
              </div>
              <div class="flex items-center gap-1">
                <button @click="prepararEdicao(item)" class="text-[#d4af37] font-bold p-1">✎</button>
                <button @click="excluirAssinatura(item.id)" class="text-[#8b0000] font-bold p-1">✕</button>
              </div>
            </div>
          </div>
        </template>

        <template x-if="assinaturas.length === 0">
          <p class="text-xs text-[#6e5d4f] italic py-4 text-center">Nenhum tributo permanente cadastrado.</p>
        </template>
      </div>
    </section>

  </div>

  <footer class="mt-6 text-center text-[9px] text-[#6e5d4f] border-t border-[#2e2316] pt-2">
    <span>Os Tributos Permanentes • Erebor OS</span>
  </footer>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDU3mYKoWh8qE3wj6R5OKqhWwXMeefEl2g",
      authDomain: "erebor-os.firebaseapp.com",
      projectId: "erebor-os",
      storageBucket: "erebor-os.firebasestorage.app",
      messagingSenderId: "733641275906",
      appId: "1:733641275906:web:d83dedfee8bc056a7e851b"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.addEventListener('alpine:init', () => {
      Alpine.data('assinaturasApp', () => ({
        assinaturas: [],
        nome: '',
        valor: '',
        diaCobranca: '',
        pagamento: 'Cartão de Crédito',
        editandoId: null,
        carregando: false,

        init() { this.escutarAssinaturas(); },

        escutarAssinaturas() {
          db.collection("assinaturas").onSnapshot((snapshot) => {
            const list = [];
            snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
            this.assinaturas = list;
          });
        },

        async salvarAssinatura() {
          if (!this.nome.trim() || !this.valor) return;

          const dados = {
            nome: this.nome.trim(),
            valor: parseFloat(this.valor) || 0,
            diaCobranca: parseInt(this.diaCobranca) || 1,
            pagamento: this.pagamento,
            atualizadoEm: new Date().toISOString()
          };

          try {
            if (this.editandoId) {
              await db.collection("assinaturas").doc(this.editandoId).update(dados);
              this.cancelarEdicao();
            } else {
              await db.collection("assinaturas").add(dados);
              this.limparFormulario();
            }
          } catch(e) { console.error("Erro ao salvar assinatura:", e); }
        },

        prepararEdicao(item) {
          this.editandoId = item.id;
          this.nome = item.nome;
          this.valor = item.valor;
          this.diaCobranca = item.diaCobranca;
          this.pagamento = item.pagamento;
        },

        cancelarEdicao() { this.editandoId = null; this.limparFormulario(); },
        limparFormulario() { this.nome = ''; this.valor = ''; this.diaCobranca = ''; this.pagamento = 'Cartão de Crédito'; },
        async excluirAssinatura(id) { await db.collection("assinaturas").doc(id).delete(); },
        calcularTotalMensal() { return this.assinaturas.reduce((a, b) => a + (parseFloat(b.valor) || 0), 0); },
        formatarMoeda(v) { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0); },
        carregarDados() { this.carregando = true; setTimeout(() => { this.carregando = false; }, 300); }
      }));
    });
  </script>
</body>
</html>
